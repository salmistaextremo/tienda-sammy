<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Pedidos — Tiendas Sammy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#fcfbf8; --surface:#ffffff; --text:#111111; --muted:#767676; --border:#e8e5df; --accent:#ffea61; --danger:#ef4444; --success:#22c55e; --radius-lg:24px; --radius-md:16px; --radius-sm:100px; }
  html,body{ background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; } a{ color:inherit; text-decoration:none; }
  .container{ max-width:900px; margin:0 auto; padding:0 24px; width: 100%; }
  
  .header{ border-bottom:1px solid var(--border); padding: 20px 0; } .header-inner{ display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-weight:700; font-size:22px; } .logo span{ background:var(--accent); padding:3px 10px; border-radius:8px; color:#111; }
  .btn-back { font-size: 14px; font-weight: 600; color: var(--muted); } .btn-back:hover { color: var(--text); }

  .auth-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { background: var(--surface); padding: 48px; border-radius: var(--radius-lg); width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); border: 1px solid var(--border); }
  .auth-card h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; } .auth-card p { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 32px; }
  .field { margin-bottom: 16px; } .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .field input { width: 100%; padding: 16px; border-radius: var(--radius-md); background: var(--bg); border: 1px solid var(--border); font-family: inherit; font-size: 15px; }
  .field input:focus { outline: none; border-color: var(--text); background: #fff; }
  .btn-primary { width: 100%; padding: 16px; border-radius: var(--radius-md); background: var(--text); color: #fff; font-weight: 600; display: flex; justify-content: center; margin-top: 8px; }
  .auth-switch { text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); } .auth-switch button { color: var(--text); font-weight: 600; text-decoration: underline; }
  .err { color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center; }

  .dashboard { flex: 1; padding: 40px 0 80px; display: none; }
  .dash-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; }
  .dash-header h1 { font-size: 32px; font-weight: 700; } .dash-header p { font-size: 15px; color: var(--muted); }
  .btn-logout { font-size: 14px; font-weight: 600; color: var(--danger); border: 1px solid var(--border); padding: 10px 20px; border-radius: var(--radius-sm); }

  .order-card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 24px; margin-bottom: 20px; }
  .order-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .order-id { font-size: 18px; font-weight: 700; } .order-date { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .order-status { padding: 6px 14px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; text-transform: uppercase; }
  .status-pendiente { background: #fef3c7; color: #92400e; } .status-confirmado { background: #dcfce7; color: #166534; } .status-cancelado { background: #fee2e2; color: #991b1b; }

  .order-items { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed var(--border); }
  .item-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .item-note { font-size: 12px; color: var(--muted); font-style: italic; display: block; margin-top: 2px; }
  
  .order-details { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .detail-item { display: flex; flex-direction: column; gap: 4px; }
  .detail-label { font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  .detail-value { font-size: 16px; font-weight: 600; } .detail-sub { font-size: 12px; color: var(--muted); }
  .text-danger { color: var(--danger); } .text-success { color: var(--success); }

  .upload-receipt-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--text); color: #fff; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; width: 100%; border: none; }
  .upload-receipt-btn:hover { background: #333; }
  .view-receipt-btn { background: var(--success); }
  .view-receipt-btn:hover { background: #16a34a; }

  .loyalty-banner { background: #ecfdf5; border: 1px solid #10b981; padding: 20px; border-radius: var(--radius-md); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
  .loyalty-banner p { color: #065f46; font-weight: 500; font-size: 14px; margin: 0; }
  .btn-loyalty { background: #10b981; color: #fff; padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; }
  .btn-loyalty:disabled { background: #d1fae5; color: #065f46; cursor: not-allowed; }

  @media(max-width: 600px) { .dash-header { flex-direction: column; align-items: flex-start; gap: 16px; } .order-details { grid-template-columns: 1fr; } .btn-logout { width: 100%; text-align: center; } .loyalty-banner { flex-direction: column; gap: 16px; text-align: center; } }
</style>
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="/" class="logo">TIENDAS <span>SAMMY</span></a>
    <a href="/" class="btn-back">← Volver a la tienda</a>
  </div>
</header>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h2 id="authTitle">Iniciar Sesión</h2><p id="authSub">Accede para ver tus pedidos.</p>
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="field" id="nameField" style="display:none;"><label>Nombre Completo</label><input type="text" id="authName"></div>
      <div class="field"><label>Correo Electrónico</label><input type="email" id="authEmail" required></div>
      <div class="field"><label>Contraseña</label><input type="password" id="authPassword" required></div>
      <button type="submit" class="btn-primary" id="btnAuthSubmit">Entrar</button><div id="authError" class="err"></div>
    </form>
    <div class="auth-switch"><span id="switchText">¿No tienes cuenta?</span> <button onclick="toggleAuthMode()" id="switchBtn">Regístrate aquí</button></div>
  </div>
</div>

<div class="dashboard" id="dashboardScreen">
  <div class="container">
    <div class="dash-header">
      <div><h1>Mis Pedidos</h1><p>Hola, <span id="userNameDisplay" style="font-weight:600; color:var(--text);"></span>.</p></div>
      <button class="btn-logout" onclick="handleLogout()">Cerrar Sesión</button>
    </div>
    
    <div id="loyaltyBanner" class="loyalty-banner" style="display: none;">
      <p>🎉 ¡Felicidades! Por tu volumen de compras, calificas para ser <strong>Vendedor Mayorista</strong>.</p>
      <button class="btn-loyalty" id="btnRequestUpgrade" onclick="requestUpgrade()">Solicitar Ascenso</button>
    </div>

    <div class="orders-list" id="ordersList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://zxhufobqfxmbjpneyiam.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4aHVmb2JxZnhtYmpwbmV5aWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNjk2OTEsImV4cCI6MjEwODc0NTY5MX0.EUS-QUdhuhtSk9rgLB11wz-GYF9m01JqhXfT6yT9_Vs";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isLoginMode = true;

function toggleAuthMode() {
  isLoginMode = !isLoginMode;
  document.getElementById('authTitle').textContent = isLoginMode ? "Iniciar Sesión" : "Crear Cuenta";
  document.getElementById('authSub').textContent = isLoginMode ? "Accede para ver tus pedidos." : "Regístrate para gestionar tus compras.";
  document.getElementById('btnAuthSubmit').textContent = isLoginMode ? "Entrar" : "Registrarse";
  document.getElementById('nameField').style.display = isLoginMode ? 'none' : 'block';
  document.getElementById('switchText').textContent = isLoginMode ? "¿No tienes cuenta?" : "¿Ya tienes cuenta?";
  document.getElementById('switchBtn').textContent = isLoginMode ? "Regístrate aquí" : "Inicia sesión";
  document.getElementById('authError').textContent = "";
}

async function handleAuth(e) {
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim(), password = document.getElementById('authPassword').value, name = document.getElementById('authName').value.trim();
  const errBox = document.getElementById('authError'), btn = document.getElementById('btnAuthSubmit');
  errBox.textContent = ""; btn.disabled = true; btn.textContent = "Procesando...";

  try {
    if (isLoginMode) {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error; checkSession();
    } else {
      if (!name) throw new Error("Ingresa tu nombre.");
      const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
      if (error) throw error;
      if (data.session) checkSession(); else { alert("Cuenta creada. Revisa tu correo."); toggleAuthMode(); }
    }
  } catch (error) { errBox.textContent = error.message; } finally { btn.disabled = false; btn.textContent = isLoginMode ? "Entrar" : "Registrarse"; }
}

async function handleLogout() { await supabaseClient.auth.signOut(); document.getElementById('dashboardScreen').style.display = 'none'; document.getElementById('authScreen').style.display = 'flex'; document.getElementById('authForm').reset(); }

async function checkSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    document.getElementById('authScreen').style.display = 'none'; document.getElementById('dashboardScreen').style.display = 'block';
    const { data: profile } = await supabaseClient.from('profiles').select('full_name').eq('id', session.user.id).single();
    document.getElementById('userNameDisplay').textContent = profile?.full_name || session.user.user_metadata?.full_name || session.user.email;
    loadMyOrders(session.user.id, session.user.email);
  } else { document.getElementById('authScreen').style.display = 'flex'; document.getElementById('dashboardScreen').style.display = 'none'; }
}

async function loadMyOrders(userId, userEmail) {
  const list = document.getElementById('ordersList');
  try {
    const { data: orders, error } = await supabaseClient.from('orders').select('*, order_items(*), installments(amount_bs, amount_usdt)').or(`user_id.eq.${userId},customer_email.eq.${userEmail}`).order('created_at', { ascending: false });
    if (error) throw error;

    checkLoyaltyStatus(orders, userId);

    if (!orders || orders.length === 0) { list.innerHTML = `<div class="empty-state"><h3>Aún no tienes pedidos</h3><p>Cuando compres, aparecerá aquí.</p><a href="/" class="btn-primary" style="display:inline-block; width:auto;">Ir a la tienda</a></div>`; return; }

    list.innerHTML = orders.map(o => {
      const shortId = String(o.id).slice(0,8).toUpperCase();
      const date = new Date(o.created_at).toLocaleDateString('es-VE', { day: '2-digit', month: 'long', year: 'numeric' });
      let abonadoBs = 0, abonadoUsdt = 0;
      if (o.installments) o.installments.forEach(i => { abonadoBs += Number(i.amount_bs || 0); abonadoUsdt += Number(i.amount_usdt || 0); });
      
      const totalBs = Number(o.total_bs), totalUsdt = Number(o.total_usdt);
      const saldoBs = Math.max(0, totalBs - abonadoBs), saldoUsdt = Math.max(0, totalUsdt - abonadoUsdt);
      const isPaid = saldoBs <= 0.1;
      const statusClass = `status-${o.status}`;

      const itemsHtml = (o.order_items || []).map(item => `
        <div class="item-row">
          <div>
            <strong>${item.quantity}x</strong> ${item.product_name} (Talla: ${item.size})
            ${item.custom_note ? `<span class="item-note">Nota: "${item.custom_note}"</span>` : ''}
          </div>
          <div>${Number(item.subtotal_bs).toLocaleString('es-VE')} Bs</div>
        </div>
      `).join('');

      // Lógica: Si ya hay comprobante, mostrar botón para VER. Si no, botón para SUBIR.
      const receiptHtml = o.receipt_url 
        ? `<a href="${o.receipt_url}" target="_blank" class="upload-receipt-btn view-receipt-btn">👁️ Ver Comprobante de Pago</a>`
        : `<label class="upload-receipt-btn">
            📸 Subir Captura de Pago
            <input type="file" accept="image/*" style="display:none;" onchange="uploadReceipt(event, '${o.id}')">
           </label>`;

      return `
        <div class="order-card">
          <div class="order-top">
            <div><div class="order-id">Pedido #${shortId}</div><div class="order-date">${date}</div></div>
            <div class="order-status ${statusClass}">${o.status.replace('_', ' ')}</div>
          </div>
          
          <div class="order-items">${itemsHtml}</div>

          <div class="order-details">
            <div class="detail-item"><span class="detail-label">Total</span><span class="detail-value">${totalBs.toLocaleString('es-VE')} Bs</span><span class="detail-sub">≈ ${totalUsdt.toFixed(2)} USDT</span></div>
            <div class="detail-item"><span class="detail-label">Saldo Pendiente</span>${isPaid ? `<span class="detail-value text-success">Pagado</span>` : `<span class="detail-value text-danger">${saldoBs.toLocaleString('es-VE')} Bs</span><span class="detail-sub text-danger">≈ ${saldoUsdt.toFixed(2)} USDT</span>`}</div>
          </div>
          
          <div style="margin-top:16px; padding-top:16px; border-top:1px dashed var(--border);">${receiptHtml}</div>
        </div>
      `;
    }).join('');
  } catch (err) { list.innerHTML = `<div class="empty-state"><p style="color:var(--danger)">Error: ${err.message}</p></div>`; }
}

async function checkLoyaltyStatus(orders, userId) {
  const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', userId).single();
  if (profile && (profile.role === 'vendedor' || profile.role === 'admin' || profile.role === 'super_admin')) return;

  const { data: reqs } = await supabaseClient.from('upgrade_requests').select('status').eq('user_id', userId).eq('status', 'pendiente');
  if (reqs && reqs.length > 0) {
    document.getElementById('loyaltyBanner').style.display = 'flex';
    document.getElementById('btnRequestUpgrade').textContent = 'Solicitud en revisión...';
    document.getElementById('btnRequestUpgrade').disabled = true;
    return;
  }

  const productStats = {};
  orders.forEach(o => {
    const seenInOrder = new Set();
    (o.order_items || []).forEach(item => {
      if(!productStats[item.product_id]) productStats[item.product_id] = { totalQty: 0, ordersCount: 0 };
      productStats[item.product_id].totalQty += item.quantity;
      if(!seenInOrder.has(item.product_id)) {
        productStats[item.product_id].ordersCount += 1;
        seenInOrder.add(item.product_id);
      }
    });
  });

  let qualifies = false;
  for (const pid in productStats) {
    if (productStats[pid].totalQty >= 12 && productStats[pid].ordersCount >= 5) qualifies = true;
  }

  if (qualifies) document.getElementById('loyaltyBanner').style.display = 'flex';
}

async function requestUpgrade() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) return;
  const btn = document.getElementById('btnRequestUpgrade');
  btn.disabled = true; btn.textContent = 'Enviando...';
  const { error } = await supabaseClient.from('upgrade_requests').insert({ user_id: session.user.id });
  if (!error) btn.textContent = 'Solicitud enviada con éxito'; else { alert("Error: " + error.message); btn.disabled = false; btn.textContent = 'Solicitar Ascenso'; }
}

async function uploadReceipt(event, orderId) {
  const file = event.target.files[0]; if (!file) return;
  const label = event.target.parentElement; const originalText = label.innerHTML; label.innerHTML = 'Subiendo...';

  try {
    const options = { maxSizeMB: 0.5, maxWidthOrHeight: 1000, useWebWorker: true };
    let fileToUpload = await imageCompression(file, options);
    const ext = fileToUpload.name.split('.').pop();
    const fileName = `receipt_${orderId}_${Date.now()}.${ext}`;
    
    const { error: uploadError } = await supabaseClient.storage.from('receipts').upload(fileName, fileToUpload);
    if (uploadError) throw uploadError;

    const { data: urlData } = supabaseClient.storage.from('receipts').getPublicUrl(fileName);
    await supabaseClient.from('orders').update({ receipt_url: urlData.publicUrl }).eq('id', orderId);
    
    checkSession(); // Recargar la vista para mostrar el botón verde
  } catch(err) {
    alert("Error al subir comprobante: " + err.message); label.innerHTML = originalText;
  }
}

checkSession();
</script>
</body>
</html>
