<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Pedidos — Tiendas Sam's</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="https://zxhufobqfxmbjpneyiam.supabase.co/storage/v1/object/public/brand-assets/logo.png">
<link rel="icon" type="image/png" href="https://zxhufobqfxmbjpneyiam.supabase.co/storage/v1/object/public/brand-assets/icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ 
    --bg:#fcfbf8; --surface:#ffffff; --text:#111111; --muted:#767676; --border:#e8e5df; 
    --accent:#ffea61; --danger:#ef4444; --success:#22c55e; --warning:#d97706; 
    --radius-lg:24px; --radius-md:16px; --radius-sm:100px; 
  }
  html,body{ 
    background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif; 
    min-height: 100vh; display: flex; flex-direction: column; 
    padding-bottom: 80px; /* Espacio para el menú inferior */
  }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; } 
  a{ color:inherit; text-decoration:none; }
  .container{ max-width:900px; margin:0 auto; padding:0 24px; width: 100%; }
  
  /* HEADER */
  .header{ border-bottom:1px solid var(--border); padding: 20px 0; background: var(--surface); } 
  .header-inner{ display:flex; align-items:center; justify-content:space-between; }
  .logo img { height: 40px; width: auto; object-fit: contain; }
  .btn-back { font-size: 14px; font-weight: 600; color: var(--muted); } .btn-back:hover { color: var(--text); }
  
  /* LOGIN */
  .auth-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { background: var(--surface); padding: 48px; border-radius: var(--radius-lg); width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); border: 1px solid var(--border); }
  .auth-card h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; } .auth-card p { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 32px; }
  .field { margin-bottom: 16px; } .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .field input { width: 100%; padding: 16px; border-radius: var(--radius-md); background: var(--bg); border: 1px solid var(--border); font-family: inherit; font-size: 15px; }
  .field input:focus { outline: none; border-color: var(--text); background: #fff; }
  .btn-primary { width: 100%; padding: 16px; border-radius: var(--radius-md); background: var(--text); color: #fff; font-weight: 600; display: flex; justify-content: center; margin-top: 8px; }
  .auth-switch { text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); } .auth-switch button { color: var(--text); font-weight: 600; text-decoration: underline; }
  .err { color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center; }

  /* DASHBOARD */
  .dashboard { flex: 1; padding: 32px 0 40px; display: none; }
  .dash-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
  .dash-header h1 { font-size: 28px; font-weight: 700; } .dash-header p { font-size: 15px; color: var(--muted); }
  .btn-logout { font-size: 13px; font-weight: 600; color: var(--danger); border: 1px solid var(--border); padding: 8px 16px; border-radius: var(--radius-sm); cursor:pointer; }
  
  .order-card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 24px; margin-bottom: 16px; }
  .order-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .order-id { font-size: 18px; font-weight: 700; } .order-date { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .order-status { padding: 6px 12px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 700; text-transform: uppercase; }
  
  .status-pendiente { background: #fef3c7; color: #92400e; } 
  .status-verificado { background: #dcfce7; color: #166534; } 
  .status-enviado { background: #dbeafe; color: #1e40af; } 
  .status-cancelado { background: #fee2e2; color: #991b1b; }
  .status-cuota1_confirmada, .status-cuota2_confirmada, .status-cuota3_confirmada { background: #e0e7ff; color: #3730a3; }
  .status-registro_pago { background: #fef3c7; color: #92400e; }

  .order-items { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed var(--border); }
  .item-row { display: flex; gap: 16px; align-items: flex-start; font-size: 14px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .item-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .item-img { width: 60px; height: 75px; object-fit: cover; border-radius: 8px; background: var(--bg); flex-shrink: 0; border: 1px solid var(--border); }
  .item-details { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .item-title { font-weight: 600; font-size: 15px; color: var(--text); }
  .item-variant { font-size: 12px; color: var(--muted); font-weight: 500; }
  .item-desc { font-size: 12px; color: #444; background: var(--bg); padding: 6px 10px; border-radius: 6px; margin-top: 4px; line-height: 1.4; border-left: 3px solid var(--border); }
  .item-note { font-size: 11px; color: #b45309; background: #fffbeb; padding: 4px 8px; border-radius: 6px; display: inline-block; margin-top: 4px; border: 1px solid #fcd34d; }
  .item-price { font-weight: 700; font-size: 14px; white-space: nowrap; }
  
  .order-details { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .detail-item { display: flex; flex-direction: column; gap: 2px; }
  .detail-label { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  .detail-value { font-size: 16px; font-weight: 600; } .detail-sub { font-size: 12px; color: var(--muted); }
  .text-danger { color: var(--danger); } .text-success { color: var(--success); }
  .text-warning { color: var(--warning); }
  
  .upload-receipt-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--text); color: #fff; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; width: 100%; border: none; }
  .upload-receipt-btn:hover { background: #333; }
  .view-receipt-btn { background: var(--success); }
  .view-receipt-btn:hover { background: #16a34a; }
  
  .plan-details-box { background: var(--bg); padding: 16px; border-radius: var(--radius-md); margin-bottom: 16px; font-size: 14px; }
  .loyalty-banner { background: #ecfdf5; border: 1px solid #10b981; padding: 16px; border-radius: var(--radius-md); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;}
  .loyalty-banner p { color: #065f46; font-weight: 500; font-size: 14px; margin: 0; }
  .btn-loyalty { background: #10b981; color: #fff; padding: 8px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; cursor:pointer; }
  .btn-loyalty:disabled { background: #d1fae5; color: #065f46; cursor: not-allowed; }

  /* NAVEGACIÓN INFERIOR (ESTILO APP) */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 70px;
    z-index: 1000;
    padding-bottom: env(safe-area-inset-bottom); /* Soporte para iPhone */
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    transition: all 0.2s;
    flex: 1;
    height: 100%;
    justify-content: center;
  }
  .nav-item .icon {
    font-size: 20px;
    transition: transform 0.2s;
  }
  .nav-item.active {
    color: var(--text);
  }
  .nav-item.active .icon {
    transform: translateY(-2px) scale(1.1);
  }
  .nav-item.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    width: 40%;
    height: 3px;
    background: var(--accent);
    border-radius: 3px 3px 0 0;
  }

  /* MODALES */
  .modal-wrap{ position:fixed; inset:0; z-index:2000; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,0.5); backdrop-filter:blur(5px); overflow-y:auto; }
  .modal-wrap.open{ display:flex; }
  .modal{ background:var(--surface); border-radius:var(--radius-lg); max-width:500px; width:100%; max-height:92vh; overflow-y:auto; position:relative; padding:32px; }
  .modal-x{ position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%; background:var(--bg); display:grid; place-items:center; cursor:pointer; }
  
  @media(max-width: 600px) { 
    .dash-header { flex-direction: column; align-items: flex-start; gap: 12px; } 
    .order-details { grid-template-columns: 1fr; gap: 12px; } 
    .btn-logout { width: 100%; text-align: center; } 
    .item-row { flex-direction: row; gap: 12px; } 
    .item-price { align-self: flex-start; }
    .bottom-nav { height: 65px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="/" class="logo">
      <img src="https://zxhufobqfxmbjpneyiam.supabase.co/storage/v1/object/public/brand-assets/logo.png" alt="Tiendas Sam's">
    </a>
    <a href="/" class="btn-back">← Volver a la tienda</a>
  </div>
</header>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h2 id="authTitle">Iniciar Sesión</h2><p id="authSub">Accede para ver tus pedidos.</p>
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="field" id="nameField" style="display:none;"><label>Nombre Completo</label><input type="text" id="authName"></div>
      <div class="field"><label>Correo Electrónico</label><input type="email" id="authEmail" required></div>
      <div class="field"><label>Contraseña</label><input type="password" id="authPassword" required></div>
      <button type="submit" class="btn-primary" id="btnAuthSubmit">Entrar</button><div id="authError" class="err"></div>
    </form>
    <div class="auth-switch"><span id="switchText">¿No tienes cuenta?</span> <button onclick="toggleAuthMode()" id="switchBtn">Regístrate aquí</button></div>
  </div>
</div>

<div class="dashboard" id="dashboardScreen">
  <div class="container">
    <div class="dash-header">
      <div><h1>Mis Pedidos</h1><p>Hola, <span id="userNameDisplay" style="font-weight:600; color:var(--text);"></span>.</p></div>
      <button class="btn-logout" onclick="handleLogout()">Cerrar Sesión</button>
    </div>
    
    <div id="loyaltyBanner" class="loyalty-banner" style="display: none;">
      <p>🎉 ¡Felicidades! Por tu volumen de compras, calificas para ser <strong>Vendedor Mayorista</strong>.</p>
      <button class="btn-loyalty" id="btnRequestUpgrade" onclick="requestUpgrade()">Solicitar Ascenso</button>
    </div>

    <div class="orders-list" id="ordersList"></div>
  </div>
</div>

<!-- BARRA DE NAVEGACIÓN INFERIOR (ESTILO APP) -->
<div class="bottom-nav" id="bottomNav" style="display: none;">
  <button class="nav-item" onclick="switchPortalTab('pendientes', this)">
    <span class="icon">⏳</span>
    Pendientes
  </button>
  <button class="nav-item active" onclick="switchPortalTab('todos', this)">
    <span class="icon">📦</span>
    Mis Pedidos
  </button>
  <button class="nav-item" onclick="switchPortalTab('finalizados', this)">
    <span class="icon">✅</span>
    Finalizados
  </button>
</div>

<!-- MODAL DE PAGO -->
<div class="modal-wrap" id="paymentModal" onclick="if(event.target.id==='paymentModal') closePaymentModal()">
  <div class="modal">
    <button class="modal-x" onclick="closePaymentModal()">✕</button>
    <h3 style="font-size:24px; margin-bottom:8px;">Realizar Pago</h3>
    <p style="font-size:14px; color:var(--muted); margin-bottom:24px;">Ingresa el monto y sube tu comprobante.</p>
    
    <div class="field">
      <label>Monto a pagar (Bs) *</label>
      <input type="number" id="payAmount" step="0.01">
    </div>
    
    <div class="field">
      <label>Método de Pago *</label>
      <select id="payMethod" onchange="updatePayDetails()" style="width:100%; padding:16px; border-radius:16px; border:1px solid var(--border); font-family:inherit;">
        <option value="bs_pago_movil">Pago Móvil</option>
        <option value="bs_transfer">Transferencia Banesco</option>
        <option value="usdt_binance">USDT (Binance)</option>
      </select>
    </div>
    
    <div id="payDetails" style="background:var(--bg); padding:16px; border-radius:12px; margin-bottom:16px; font-size:14px; line-height:1.6;"></div>
    
    <div class="field">
      <label>Comprobante de Pago *</label>
      <input type="file" id="payReceipt" accept="image/*" style="width:100%; padding:12px; background:#fff; border:1px dashed var(--border); border-radius:8px;">
    </div>
    
    <button class="btn-primary" onclick="submitPayment()">Enviar Pago</button>
    <div id="payError" class="err"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://zxhufobqfxmbjpneyiam.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4aHVmb2JxZnhtYmpwbmV5aWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNjk2OTEsImV4cCI6MjEwODc0NTY5MX0.EUS-QUdhuhtSk9rgLB11wz-GYF9m01JqhXfT6yT9_Vs";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const fmtUSD = n => "$ " + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtBs = n => "Bs " + Number(n).toLocaleString('es-VE',{minimumFractionDigits:0,maximumFractionDigits:2});

let isLoginMode = true;
let currentUserId = null;
let currentUserEmail = null;
let myOrdersData = []; // Almacén local de pedidos
let currentTab = 'todos'; // Pestaña actual

const statusLabels = {
  'pendiente': 'Pendiente',
  'verificado': 'Verificado',
  'enviado': 'Enviado',
  'cuota1_confirmada': 'Cuota 1 Confirmada',
  'cuota2_confirmada': 'Cuota 2 Confirmada',
  'cuota3_confirmada': 'Cuota 3 Confirmada',
  'registro_pago': 'Registro de Pago',
  'cancelado': 'Cancelado'
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error:', err));
  });
}

function toggleAuthMode() {
  isLoginMode = !isLoginMode;
  document.getElementById('authTitle').textContent = isLoginMode ? "Iniciar Sesión" : "Crear Cuenta";
  document.getElementById('authSub').textContent = isLoginMode ? "Accede para ver tus pedidos." : "Regístrate para gestionar tus compras.";
  document.getElementById('btnAuthSubmit').textContent = isLoginMode ? "Entrar" : "Registrarse";
  document.getElementById('nameField').style.display = isLoginMode ? 'none' : 'block';
  document.getElementById('switchText').textContent = isLoginMode ? "¿No tienes cuenta?" : "¿Ya tienes cuenta?";
  document.getElementById('switchBtn').textContent = isLoginMode ? "Regístrate aquí" : "Inicia sesión";
  document.getElementById('authError').textContent = "";
}

async function handleAuth(e) {
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim(), password = document.getElementById('authPassword').value, name = document.getElementById('authName').value.trim();
  const errBox = document.getElementById('authError'), btn = document.getElementById('btnAuthSubmit');
  errBox.textContent = ""; btn.disabled = true; btn.textContent = "Procesando...";

  try {
    if (isLoginMode) {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error; checkSession();
    } else {
      if (!name) throw new Error("Ingresa tu nombre.");
      const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
      if (error) throw error;
      if (data.session) checkSession(); else { alert("Cuenta creada. Revisa tu correo."); toggleAuthMode(); }
    }
  } catch (error) { errBox.textContent = error.message; } finally { btn.disabled = false; btn.textContent = isLoginMode ? "Entrar" : "Registrarse"; }
}

async function handleLogout() { await supabaseClient.auth.signOut(); location.reload(); }

async function checkSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    currentUserId = session.user.id;
    currentUserEmail = session.user.email;
    document.getElementById('authScreen').style.display = 'none'; 
    document.getElementById('dashboardScreen').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex'; // Mostrar barra inferior
    
    const { data: profile } = await supabaseClient.from('profiles').select('full_name').eq('id', session.user.id).single();
    document.getElementById('userNameDisplay').textContent = profile?.full_name || session.user.user_metadata?.full_name || session.user.email;
    
    loadMyOrders(currentUserId, currentUserEmail);
    suscribirseCambiosCliente();
  } else { 
    document.getElementById('authScreen').style.display = 'flex'; 
    document.getElementById('dashboardScreen').style.display = 'none'; 
    document.getElementById('bottomNav').style.display = 'none'; 
  }
}

function suscribirseCambiosCliente() {
  supabaseClient
    .channel('cambios-cliente')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
      if (payload.new.user_id === currentUserId || payload.new.customer_email === currentUserEmail) {
        loadMyOrders(currentUserId, currentUserEmail);
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'installments' }, payload => {
       loadMyOrders(currentUserId, currentUserEmail);
    })
    .subscribe();
}

async function loadMyOrders(userId, userEmail) {
  const list = document.getElementById('ordersList');
  try {
    const { data: orders, error } = await supabaseClient
      .from('orders')
      .select('*, order_items(*, products(image_url, description)), installments(*)')
      .or(`user_id.eq.${userId},customer_email.eq.${userEmail}`)
      .order('created_at', { ascending: false });
      
    if (error) throw error;

    checkLoyaltyStatus(orders, userId);
    myOrdersData = orders || [];
    
    renderFilteredOrders(); // Renderizar según la pestaña actual

  } catch (err) { list.innerHTML = `<div class="empty-state"><p style="color:var(--danger)">Error: ${err.message}</p></div>`; }
}

function switchPortalTab(tabName, btnElement) {
  currentTab = tabName;
  
  // Actualizar clases activas
  document.querySelectorAll('.bottom-nav .nav-item').forEach(btn => btn.classList.remove('active'));
  if(btnElement) btnElement.classList.add('active');

  renderFilteredOrders();
}

function renderFilteredOrders() {
  const list = document.getElementById('ordersList');
  
  // Filtrar pedidos
  let filtered = myOrdersData;
  
  if (currentTab === 'pendientes') {
    filtered = myOrdersData.filter(o => !['enviado', 'cancelado', 'entregado'].includes(o.status));
  } else if (currentTab === 'finalizados') {
    filtered = myOrdersData.filter(o => ['enviado', 'entregado', 'cancelado'].includes(o.status));
  }

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state" style="text-align:center; padding:40px; color:var(--muted);">
      <h3 style="margin-bottom:8px;">No hay pedidos aquí</h3>
      <p>Cuando tengas pedidos en esta categoría, aparecerán aquí.</p>
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(o => {
    const shortId = String(o.id).slice(0,8).toUpperCase();
    const date = new Date(o.created_at).toLocaleDateString('es-VE', { day: '2-digit', month: 'long', year: 'numeric' });
    
    let abonadoBs = 0;
    let pendienteBs = 0;
    
    if (o.installments) {
      o.installments.forEach(i => {
        if (i.status === 'pendiente') {
          pendienteBs += Number(i.amount_bs || 0);
        } else {
          abonadoBs += Number(i.amount_bs || 0);
        }
      });
    }
    
    const totalBs = Number(o.total_bs);
    const totalUsdt = Number(o.total_usdt);
    const ratio = totalBs / totalUsdt;
    const saldoBs = Math.max(0, totalBs - abonadoBs);
    const saldoUsdt = saldoBs / ratio;
    
    const isPaid = saldoBs <= 0.1;
    const statusClass = `status-${o.status}`;
    const statusText = statusLabels[o.status] || o.status;

    const itemsHtml = (o.order_items || []).map(item => `
      <div class="item-row">
        ${item.products?.image_url ? `<img src="${item.products.image_url}" class="item-img">` : `<div class="item-img"></div>`}
        <div class="item-details">
          <div class="item-title">${item.product_name}</div>
          <div class="item-variant">Talla: ${item.size} | Cant: ${item.quantity}</div>
          ${item.products?.description ? `<div class="item-desc">${item.products.description}</div>` : ''}
          ${item.custom_note ? `<div class="item-note">📝 Nota: "${item.custom_note}"</div>` : ''}
        </div>
        <div class="item-price">${fmtUSD(item.subtotal_usdt)}</div>
      </div>
    `).join('');

    let planDetailsHtml = "";
    if(o.payment_plan_details) {
      const d = o.payment_plan_details;
      if(o.payment_plan === 'credito') {
        planDetailsHtml = `
          <div class="plan-details-box">
            <strong>Plan de Crédito (3 cuotas de ${fmtUSD(d.cuota_monto / ratio)}):</strong><br>
            Cuota 1: ${d.cuota1_pagada ? '✅ Pagada' : '⏳ Pendiente'}<br>
            Cuota 2: ${d.cuota2_pagada ? '✅ Pagada' : '⏳ Pendiente'}<br>
            Cuota 3: ${d.cuota3_pagada ? '✅ Pagada' : '⏳ Pendiente'}
          </div>
        `;
      } else if (o.payment_plan === 'apartado') {
        planDetailsHtml = `
          <div class="plan-details-box">
            <strong>Plan de Apartado:</strong><br>
            Abono Inicial: ${fmtUSD(d.abono_inicial / ratio)}<br>
            Saldo Pendiente inicial: <strong style="color:var(--danger);">${fmtUSD(d.saldo_pendiente / ratio)}</strong>
          </div>
        `;
      }
    }

    const canPay = saldoBs > 0.1 && (o.payment_plan === 'credito' || o.payment_plan === 'apartado');
    const payButtonHtml = canPay ? `
      <div style="margin-top:16px;">
        <button class="btn-primary" style="background:var(--text); color:#fff; width:100%;" onclick="openPaymentModal('${o.id}', ${saldoBs})">💸 Realizar Pago / Abono</button>
        ${pendienteBs > 0 ? `<p style="color:var(--warning); font-size:13px; margin-top:8px; text-align:center;">⏳ Tienes un pago de ${fmtUSD(pendienteBs/ratio)} pendiente por verificar.</p>` : ''}
      </div>
    ` : '';

    const mainReceiptHtml = o.receipt_url 
      ? `<a href="${o.receipt_url}" target="_blank" class="upload-receipt-btn view-receipt-btn">👁️ Ver Comprobante Inicial</a>`
      : '';

    return `
      <div class="order-card">
        <div class="order-top">
          <div><div class="order-id">Pedido #${shortId}</div><div class="order-date">${date}</div></div>
          <div class="order-status ${statusClass}">${statusText}</div>
        </div>
        
        <div class="order-items">${itemsHtml}</div>

        ${planDetailsHtml}

        <div class="order-details">
          <div class="detail-item"><span class="detail-label">Total</span><span class="detail-value">${fmtUSD(totalUsdt)}</span><span class="detail-sub">≈ ${fmtBs(totalBs)}</span></div>
          <div class="detail-item"><span class="detail-label">Saldo Pendiente</span>${isPaid ? `<span class="detail-value text-success">Pagado</span>` : `<span class="detail-value text-danger">${fmtUSD(saldoUsdt)}</span><span class="detail-sub text-danger">≈ ${fmtBs(saldoBs)}</span>`}</div>
        </div>
        
        <div style="margin-top:16px; padding-top:16px; border-top:1px dashed var(--border);">
          ${payButtonHtml}
          ${mainReceiptHtml}
        </div>
      </div>
    `;
  }).join('');
}

async function checkLoyaltyStatus(orders, userId) {
  const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', userId).single();
  if (profile && (profile.role === 'vendedor' || profile.role === 'admin' || profile.role === 'super_admin')) return;

  const { data: reqs } = await supabaseClient.from('upgrade_requests').select('status').eq('user_id', userId).eq('status', 'pendiente');
  if (reqs && reqs.length > 0) {
    document.getElementById('loyaltyBanner').style.display = 'flex';
    document.getElementById('btnRequestUpgrade').textContent = 'Solicitud en revisión...';
    document.getElementById('btnRequestUpgrade').disabled = true;
    return;
  }

  const productStats = {};
  orders.forEach(o => {
    const seenInOrder = new Set();
    (o.order_items || []).forEach(item => {
      if(!productStats[item.product_id]) productStats[item.product_id] = { totalQty: 0, ordersCount: 0 };
      productStats[item.product_id].totalQty += item.quantity;
      if(!seenInOrder.has(item.product_id)) {
        productStats[item.product_id].ordersCount += 1;
        seenInOrder.add(item.product_id);
      }
    });
  });

  let qualifies = false;
  for (const pid in productStats) {
    if (productStats[pid].totalQty >= 12 && productStats[pid].ordersCount >= 5) qualifies = true;
  }

  if (qualifies) document.getElementById('loyaltyBanner').style.display = 'flex';
}

async function requestUpgrade() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) return;
  const btn = document.getElementById('btnRequestUpgrade');
  btn.disabled = true; btn.textContent = 'Enviando...';
  const { error } = await supabaseClient.from('upgrade_requests').insert({ user_id: session.user.id });
  if (!error) btn.textContent = 'Solicitud enviada con éxito'; else { alert("Error: " + error.message); btn.disabled = false; btn.textContent = 'Solicitar Ascenso'; }
}

let currentPayOrderId = null;
let currentPaySaldoBs = 0;

function openPaymentModal(orderId, saldoBs) {
  currentPayOrderId = orderId;
  currentPaySaldoBs = saldoBs;
  document.getElementById('payAmount').value = saldoBs;
  document.getElementById('payMethod').value = 'bs_pago_movil';
  updatePayDetails();
  document.getElementById('payReceipt').value = "";
  document.getElementById('payError').textContent = "";
  document.getElementById('paymentModal').classList.add('open');
}

function closePaymentModal() { document.getElementById('paymentModal').classList.remove('open'); }

function updatePayDetails() {
  const method = document.getElementById('payMethod').value;
  const div = document.getElementById('payDetails');
  if (method === 'bs_pago_movil') div.innerHTML = `<strong>Banco:</strong> 0134 Banesco<br><strong>Teléfono:</strong> 04243351245<br><strong>Cédula:</strong> 26464322`;
  else if (method === 'bs_transfer') div.innerHTML = `<strong>Banco:</strong> Banesco (0134)<br><strong>Cédula:</strong> 26464322<br><strong>Titular:</strong> Tiendas Sam's`;
  else if (method === 'usdt_binance') div.innerHTML = `<strong>Correo:</strong> samiibelisario@gmail.com<br><strong>UID:</strong> 219555454`;
}

async function submitPayment() {
  const errBox = document.getElementById('payError');
  const amount = parseFloat(document.getElementById('payAmount').value);
  const method = document.getElementById('payMethod').value;
  const fileInput = document.getElementById('payReceipt');
  
  if (isNaN(amount) || amount <= 0) { errBox.textContent = "Ingresa un monto válido."; return; }
  if (amount > currentPaySaldoBs + 0.1) { errBox.textContent = "El monto no puede superar el saldo pendiente."; return; }
  if (fileInput.files.length === 0) { errBox.textContent = "Debes subir un comprobante."; return; }
  
  const btn = document.querySelector('#paymentModal .btn-primary');
  btn.disabled = true; btn.textContent = "Enviando...";
  
  try {
    const file = fileInput.files[0];
    const options = { maxSizeMB: 0.5, maxWidthOrHeight: 1000, useWebWorker: true };
    const compressedFile = await imageCompression(file, options);
    const ext = compressedFile.name.split('.').pop();
    const fileName = `receipt_${currentPayOrderId}_${Date.now()}.${ext}`;
    
    const { error: uploadError } = await supabaseClient.storage.from('receipts').upload(fileName, compressedFile);
    if (uploadError) throw new Error("Error al subir comprobante: " + uploadError.message);
    const receipt_url = supabaseClient.storage.from('receipts').getPublicUrl(fileName).data.publicUrl;
    
    const { data: order } = await supabaseClient.from('orders').select('total_bs, total_usdt').eq('id', currentPayOrderId).single();
    const ratio = Number(order.total_bs) / Number(order.total_usdt);
    const amountUsdt = amount / ratio;
    
    const { error: instError } = await supabaseClient.from('installments').insert({
      order_id: currentPayOrderId,
      amount_bs: amount,
      amount_usdt: amountUsdt,
      method: method,
      reference: "Pago desde Portal",
      receipt_url: receipt_url,
      notes: "Pendiente de verificación",
      status: "pendiente"
    });
    
    if (instError) throw instError;
    closePaymentModal();
    checkSession();
  } catch(err) {
    errBox.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = "Enviar Pago";
  }
}

checkSession();
</script>
