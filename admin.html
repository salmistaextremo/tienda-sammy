<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiendas Sam's — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="https://zxhufobqfxmbjpneyiam.supabase.co/storage/v1/object/public/brand-assets/logo.png">
<link rel="icon" type="image/png" href="https://zxhufobqfxmbjpneyiam.supabase.co/storage/v1/object/public/brand-assets/icon-192.png">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#f8f6f0; --surface:#ffffff; --text:#1a1a1a; --muted:#7a7a7a; --border:#e8e4db; --accent:#ffea61; --danger:#ef4444; --success:#22c55e; --warning:#d97706; --radius-lg:24px; --radius-md:16px; --radius-sm:100px; }
  html,body{ background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; } 
  .container{ max-width:1200px; margin:0 auto; padding:0 24px; }

  /* LOGIN */
  .login-wrapper{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ background:var(--surface); border-radius:var(--radius-lg); padding:48px; width:100%; max-width:420px; box-shadow:0 10px 30px rgba(0,0,0,0.04); }
  .login-logo { text-align: center; margin-bottom: 32px; display: flex; justify-content: center; }
  .login-logo img { height: 60px; width: auto; object-fit: contain; }
  .field{ margin-bottom:20px; } .field label{ display:block; font-size:13px; font-weight:600; margin-bottom:8px; } 
  .field input{ width:100%; padding:16px; border-radius:var(--radius-md); background:var(--bg); border:1px solid var(--border); font-family:inherit; }
  .btn-primary{ width:100%; padding:16px; border-radius:var(--radius-md); background:var(--text); color:#fff; font-weight:600; display:flex; justify-content:center; cursor:pointer; }

  /* PANEL */
  #adminPanel{ display:none; }
  .admin-header{ background:var(--surface); border-bottom:1px solid var(--border); padding:0 32px; height:80px; display:flex; align-items:center; justify-content:space-between; }
  .admin-header .logo img { height: 40px; width: auto; object-fit: contain; }
  .admin-header-right{ display:flex; align-items:center; gap:20px; }
  .logout-btn{ padding:10px 20px; border-radius:var(--radius-sm); background:var(--bg); font-size:14px; font-weight:600; border:1px solid var(--border); cursor:pointer; }

  .admin-main{ padding:40px 32px; max-width:1240px; margin:0 auto; }
  .admin-title{ font-size:32px; margin-bottom:8px; } .admin-sub{ font-size:15px; color:var(--muted); margin-bottom:32px; }
  
  /* TARJETAS DE ESTADÍSTICAS (KPIs) */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
  .kpi-card { background: var(--surface); border-radius: var(--radius-md); padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid var(--border); position: relative; overflow: hidden; }
  .kpi-card::before { content: ''; position: absolute; top:0; left:0; width: 4px; height: 100%; background: var(--accent); }
  .kpi-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
  .kpi-value { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .kpi-sub { font-size: 13px; color: var(--muted); font-weight: 500; }

  .tabs{ display:flex; gap:8px; margin-bottom:32px; background:var(--surface); padding:8px; border-radius:var(--radius-md); display:inline-flex; overflow-x:auto; max-width:100%; }
  .tab{ padding:12px 24px; font-size:15px; font-weight:600; color:var(--muted); border-radius:var(--radius-sm); cursor:pointer; white-space:nowrap; } 
  .tab.active{ background:var(--accent); color:#111; }
  
  .panel{ display:none; } .panel.active{ display:block; }

  /* TABLAS */
  .data-table-wrap{ background:var(--surface); border-radius:var(--radius-lg); box-shadow:0 10px 30px rgba(0,0,0,0.04); overflow-x:auto; }
  .data-table{ width:100%; border-collapse:collapse; min-width: 900px; }
  .data-table th, .data-table td{ padding:16px 20px; text-align:left; font-size:14px; border-bottom:1px solid var(--border); vertical-align: middle; }
  .data-table th{ background:rgba(248,246,240,0.5); font-weight:600; font-size:12px; text-transform:uppercase; color:var(--muted); }
  
  .tag{ display:inline-block; padding:6px 12px; border-radius:var(--radius-sm); font-size:12px; font-weight:600; }
  .tag-activo{ background:#dcfce7; color:#166534; } .tag-inactivo{ background:#fee2e2; color:#991b1b; }
  
  .status-select{ padding:10px 16px; border-radius:var(--radius-sm); background:var(--bg); border:1px solid var(--border); font-size:13px; font-weight:600; outline:none; cursor:pointer; max-width: 100%; }
  
  .btn-sm{ padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; }
  .btn-view{ background:var(--bg); border:1px solid var(--border); margin-right:8px; cursor:pointer; } .btn-view:hover{ border-color:var(--text); }
  .btn-delete{ background:#fee2e2; color:#991b1b; margin-left: 8px; cursor: pointer;}
  .btn-new{ background:var(--accent); color:#111; padding:10px 20px; border-radius:var(--radius-sm); font-weight:700; font-size:14px; cursor:pointer; }

  /* MODALES */
  .modal-wrap{ position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,0.5); backdrop-filter:blur(5px); overflow-y:auto; }
  .modal-wrap.open{ display:flex; }
  .modal{ background:var(--surface); border-radius:var(--radius-lg); max-width:640px; width:100%; max-height:92vh; overflow-y:auto; position:relative; padding:40px; }
  .modal-x{ position:absolute; top:20px; right:20px; width:40px; height:40px; border-radius:50%; background:var(--bg); display:grid; place-items:center; cursor:pointer; }
  .modal h3{ font-size:24px; margin-bottom:24px; font-weight:700; }
  
  .form-group{ margin-bottom:16px; } 
  .form-group label{ display:block; font-size:13px; font-weight:600; margin-bottom:8px; }
  .form-group input, .form-group select, .form-group textarea{ width:100%; padding:14px; border-radius:var(--radius-md); background:var(--bg); border:1px solid var(--border); font-family:inherit; }
  
  .item-detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
  .item-detail-info { display: flex; gap: 12px; align-items: flex-start; }
  .item-detail-img { width: 50px; height: 65px; object-fit: cover; border-radius: 6px; background: var(--bg); flex-shrink: 0; }
  .item-detail-text { flex: 1; }
  .item-detail-desc { font-size: 12px; color: var(--muted); margin-top: 2px; display: block; }
  .item-detail-note { font-size: 12px; color: var(--text); font-style: italic; margin-top: 4px; display: block; background: var(--bg); padding: 2px 6px; border-radius: 4px; }
  .receipt-img-preview { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); cursor: pointer; }

  /* VISTA PREVIA Y UPLOADS */
  .file-upload-box { border: 1px dashed var(--border); padding: 12px; border-radius: var(--radius-md); background: var(--bg); margin-bottom: 8px; }
  .file-upload-box input[type="file"] { width: 100%; font-size: 13px; color: var(--muted); cursor: pointer; }
  .gallery-preview { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 8px; }
  .gallery-preview img { width: 60px; height: 75px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
